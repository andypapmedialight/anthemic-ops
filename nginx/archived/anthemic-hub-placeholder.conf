# =============================================================================
# Anthemic hub - TEMPORARY placeholder vhost (no upstream containers required)
# =============================================================================
# Use this in place of nginx-anthemic-hub.conf while you have not yet brought
# up the hub / personal / bass / setlist containers.
#
# Install on the Droplet:
#   sudo cp docs/anthemic-hub-placeholder/index.html /var/www/anthemic-hub/index.html
#   sudo cp docs/nginx-anthemic-hub-placeholder.conf /etc/nginx/sites-available/anthemic-hub
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prep the webroot once:
#   sudo mkdir -p /var/www/anthemic-hub
#   sudo chown -R www-data:www-data /var/www/anthemic-hub
#
# When you are ready to wire real upstreams, swap this file for
# nginx-anthemic-hub.conf and reload again.
# =============================================================================

# --- HTTP: ACME + redirect to HTTPS -----------------------------------------
server {
    listen 80;
    server_name anthemic-developments.com www.anthemic-developments.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;

    server_name anthemic-developments.com www.anthemic-developments.com;

    ssl_certificate     /etc/letsencrypt/live/anthemic-developments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anthemic-developments.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/anthemic-hub;
    index index.html;

    # Hub menu and any unmatched path → placeholder
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Project sections show the same placeholder for now (links are disabled in HTML)
    location /personal/ { try_files $uri /index.html; }
    location /bass/     { try_files $uri /index.html; }
    location /setlist/  { try_files $uri /index.html; }

    # API not wired yet - return 503 instead of bad-gateway noise
    location /api/ {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"Anthemic API not deployed yet."}';
    }
}
