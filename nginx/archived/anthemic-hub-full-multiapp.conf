# =============================================================================
# Anthemic hub — production nginx site (host installs this file)
# Related: deployment-anthemic-nginx-stages.md, nginx-setlist-generator.conf
# =============================================================================
# Copy to the Droplet:
#   sudo cp docs/nginx-anthemic-hub.conf /etc/nginx/sites-available/anthemic-hub
#   sudo ln -sf /etc/nginx/sites-available/anthemic-hub /etc/nginx/sites-enabled/anthemic-hub
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstreams (loopback only — bind containers to 127.0.0.1):
#   Hub menu (static):     127.0.0.1:8070
#   Personal site:         127.0.0.1:8071
#   Bass coaching:         127.0.0.1:8072
#   Set List SPA:          127.0.0.1:8090   (Vite base must be /setlist/)
#   Set List API (Spring): 127.0.0.1:8081  (server.address=127.0.0.1)
#
# TLS (adjust live dir name if Certbot used a different folder):
#   sudo certbot certonly --webroot -w /var/www/html \
#     -d anthemic-developments.com -d www.anthemic-developments.com
#
# Set List: build web with base /setlist/ so assets load under /setlist/assets/...
# API stays at URL path /api/ on this host (same as nginx-setlist-generator.conf).
# If another Anthemic app needs /api/, use path-specific prefixes on the backends.
# =============================================================================

upstream anthemic_hub {
    server 127.0.0.1:8070;
}

upstream anthemic_personal {
    server 127.0.0.1:8071;
}

upstream anthemic_bass {
    server 127.0.0.1:8072;
}

upstream setlist_static {
    server 127.0.0.1:8090;
}

upstream setlist_api {
    server 127.0.0.1:8081;
}

# --- HTTP: ACME + redirect to HTTPS -----------------------------------------
server {
    listen 80;
    server_name anthemic-developments.com www.anthemic-developments.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;

    server_name anthemic-developments.com www.anthemic-developments.com;

    ssl_certificate     /etc/letsencrypt/live/anthemic-developments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anthemic-developments.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Normalize bare paths → trailing slash (helps upstream relative URLs)
    location = /setlist {
        return 301 https://$host/setlist/;
    }
    location = /personal {
        return 301 https://$host/personal/;
    }
    location = /bass {
        return 301 https://$host/bass/;
    }

    # Set List Generator — SPA (strip /setlist/ prefix; upstream serves Vite root)
    location /setlist/ {
        proxy_pass http://setlist_static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Personal site (strip /personal/ prefix for upstream root)
    location /personal/ {
        proxy_pass http://anthemic_personal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Bass coaching (strip /bass/ prefix)
    location /bass/ {
        proxy_pass http://anthemic_bass/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Set List API — full URI preserved (Spring: /api/v1/...)
    location /api/ {
        proxy_pass http://setlist_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Hub landing + menu (must be last among path prefixes)
    location / {
        proxy_pass http://anthemic_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# =============================================================================
# Optional: Set List static files from disk instead of :8090
# =============================================================================
# Replace the /setlist/ location with something like:
#
#     root /var/www/setlist-generator;
#     location /setlist/ {
#         alias /var/www/setlist-generator/;
#         try_files $uri $uri/ /setlist/index.html;
#     }
#
# (Adjust try_files to match how you deploy under alias; test carefully.)
# =============================================================================
