# Include from http { } (default Debian/Ubuntu: /etc/nginx/nginx.conf includes conf.d/*.conf).
# Rate limits for anthemic-hub contact API (used in sites-available/anthemic-hub.conf).

limit_req_zone $binary_remote_addr zone=hub_contact_post:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=hub_contacts_get:10m rate=30r/m;
