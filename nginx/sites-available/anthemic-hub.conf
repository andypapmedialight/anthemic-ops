# =============================================================================
# Anthemic hub + Set List Generator - nginx site
# =============================================================================
# Stage: hub + Set List live + bass static under /bass/; personal still placeholder.
# Replaces docs/nginx-anthemic-hub-placeholder.conf on the Droplet.
#
# Install:
#   sudo cp docs/nginx-anthemic-hub-with-setlist.conf /etc/nginx/sites-available/anthemic-hub
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires (already done in earlier phases):
#   /var/www/anthemic-hub/index.html         - hub landing page
#   /var/www/anthemic-hub/bass/index.html    - bass coaching static site
#   /var/www/setlist-generator/index.html    - Vite build output (base /setlist/)
#   setlist-api.service running on 127.0.0.1:8081
# =============================================================================

upstream setlist_api {
    server 127.0.0.1:8081;
}

upstream mmd_valuation {
    server 127.0.0.1:8071;
    keepalive 4;
}

upstream papaweb_contact {
    server 127.0.0.1:8072;
    keepalive 2;
}

# --- HTTP: ACME + redirect to HTTPS -----------------------------------------
server {
    listen 80;
    server_name anthemic-developments.com www.anthemic-developments.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;

    server_name anthemic-developments.com www.anthemic-developments.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/anthemic-developments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anthemic-developments.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # wasm-unsafe-eval + worker-src blob: required by model-viewer on /brain/.
    # style-src unsafe-inline kept: all pages use large inline <style> blocks (CSS vars, layout).
    # connect-src: bass contact form; /economics/ market data + optional CORS fallbacks.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ajax.googleapis.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.bunny.net fonts.googleapis.com; font-src fonts.bunny.net fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://hooks.slack.com https://api.web3forms.com https://formspree.io https://query1.finance.yahoo.com https://fred.stlouisfed.org https://api.frankfurter.dev https://api.coingecko.com https://api.allorigins.win https://corsproxy.io https://www.alphavantage.co; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Never serve dotfiles from the static tree (.fred-api-key, .env, …).
    location ~ /\. {
        deny all;
        return 404;
    }

    # Larger upload size so song files / setlist imports go through nginx.
    client_max_body_size 80M;

    # ---- Set List API (proxy to Spring Boot on 127.0.0.1:8081) -------------
    location /api/ {
        proxy_pass http://setlist_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # ---- Set List SPA (Vite build, base /setlist/) -------------------------
    # Static files from disk; deep-link routes fall back to /setlist/index.html
    # so React Router (BrowserRouter basename=/setlist) can take over.
    # NOTE: no "=404" at the end - that short-circuits the SPA fallback when
    # combined with `alias`. Without it, the last try_files arg becomes an
    # internal redirect that re-enters this location and serves index.html.
    location = /setlist {
        return 301 https://$host/setlist/;
    }
    location /setlist/ {
        alias /var/www/setlist-generator/;
        try_files $uri $uri/ /setlist/index.html;
    }

    # ---- Hub + placeholders + bass static ---------------------------------
    root /var/www/anthemic-hub;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /bass/site.css {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /content/ {
        add_header Cache-Control "public, max-age=120, must-revalidate";
    }
    location = /gigs/gigs.json {
        add_header Cache-Control "public, max-age=120, must-revalidate";
    }
    location = /assets/gallery/manifest.json {
        add_header Cache-Control "public, max-age=120, must-revalidate";
    }

    # ---- Admin (PHP container on 127.0.0.1:9001) ---------------------------
    location = /anth-dev-ad/admin { return 301 https://$host/anth-dev-ad/admin/; }
    location /anth-dev-ad/admin/ {
        auth_basic "Anthemic Admin";
        auth_basic_user_file /etc/nginx/conf.d/gigs-admin.htpasswd;
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bass: files live at /var/www/anthemic-hub/bass/ (hub CI + apply script).
    # try_files ends at /bass/index.html so GET /bass/ always resolves (root+index alone can 404 on some nginx builds).
    location = /personal { return 301 https://$host/personal/; }
    location = /personal/writing { return 301 https://$host/personal/writing/; }
    location = /bass     { return 301 https://$host/bass/; }
    location = /economics { return 301 https://$host/economics/; }
    # Exact URL for smoke tests and browsers: directory $uri in a generic try_files chain can 404 on some nginx builds.
    location = /personal/writing/ {
        root /var/www/anthemic-hub;
        try_files /personal/writing/index.html =404;
    }
    # Static tree under personal/ (index at /personal/, assets under /personal/writing/).
    location ^~ /personal/ {
        root /var/www/anthemic-hub;
        try_files $uri $uri/index.html =404;
    }

    # PapaWeb contact API (loopback Node service; secrets stay server-side).
    location = /bass/api/contact {
        limit_req zone=hub_contact_post burst=8 nodelay;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://papaweb_contact/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
    # Bearer token only (no auth_basic here — fetch sends Authorization: Bearer, not Basic).
    location = /bass/api/contacts {
        limit_req zone=hub_contacts_get burst=10 nodelay;
        proxy_pass http://papaweb_contact/contacts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ^~ /bass/admin/ {
        auth_basic "Anthemic Admin";
        auth_basic_user_file /etc/nginx/conf.d/gigs-admin.htpasswd;
        root /var/www/anthemic-hub;
        try_files $uri $uri/ =404;
    }
    location /bass/ {
        root /var/www/anthemic-hub;
        try_files $uri $uri/index.html /bass/index.html;
    }
    # Morning Macro: same-origin proxy (split endpoints — nginx leaves url= encoded).
    location = /economics/proxy/yahoo {
        if ($arg_sym = "") { return 400; }
        if ($arg_sym !~ "^[%^A-Za-z0-9=\\.\\-]+$") { return 403; }
        set $yh_range $arg_range;
        if ($yh_range = "") { set $yh_range 5d; }
        set $yh_interval $arg_interval;
        if ($yh_interval = "") { set $yh_interval 1d; }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://query1.finance.yahoo.com/v8/finance/chart/$arg_sym?interval=$yh_interval&range=$yh_range;
        proxy_ssl_server_name on;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; MorningMacro/1.0)";
        proxy_set_header Accept "application/json, text/csv, text/plain, */*";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /economics/proxy/google {
        if ($arg_path = "") { return 400; }
        if ($arg_path !~ "^[A-Za-z0-9.^=:\\-]+$") { return 403; }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://www.google.com/finance/quote/$arg_path;
        proxy_ssl_server_name on;
        proxy_set_header Host www.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; MorningMacro/1.0)";
        proxy_set_header Accept "text/html,application/xhtml+xml,*/*";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /economics/proxy/fred {
        if ($arg_id = "") { return 400; }
        if ($arg_id !~ "^[A-Z0-9]+$") { return 403; }
        include /etc/nginx/snippets/mmd-fred-api-key.conf;
        if ($mmd_fred_api_key = "") { return 503; }
        set $fred_start $arg_start;
        if ($fred_start = "") { set $fred_start 2020-01-01; }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://api.stlouisfed.org/fred/series/observations?series_id=$arg_id&file_type=json&sort_order=asc&limit=100000&observation_start=$fred_start&api_key=$mmd_fred_api_key;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        proxy_set_header Host api.stlouisfed.org;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; MorningMacro/1.0)";
        proxy_set_header Accept "application/json";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }
    # Morning Macro: valuation health (fast probe for macro.js; no BIS fetch).
    location = /economics/proxy/valuation/health {
        proxy_pass http://mmd_valuation/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }
    # Morning Macro: BIS/FRED valuation cards (mmd-valuation.service on 127.0.0.1:8071).
    location = /economics/proxy/valuation {
        if ($arg_metric = "") { return 400; }
        if ($arg_metric !~ "^(margin-debt|otc-notional|otc-gmv|au-cgs|asx-bond-fut)$") { return 403; }
        proxy_pass http://mmd_valuation/valuation$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }
    # Exact match avoids try_files redirect loop (500) when index.html is missing.
    location = /economics/ {
        root /var/www/anthemic-hub;
        try_files /economics/index.html =404;
    }

    # Hub landing + any unmatched path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
