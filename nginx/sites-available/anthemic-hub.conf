# =============================================================================
# Anthemic hub + Set List Generator — nginx site
# =============================================================================
# Stage: hub + Set List live + bass static under /bass/; personal still placeholder.
# Replaces docs/nginx-anthemic-hub-placeholder.conf on the Droplet.
#
# Install:
#   sudo cp docs/nginx-anthemic-hub-with-setlist.conf /etc/nginx/sites-available/anthemic-hub
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires (already done in earlier phases):
#   /var/www/anthemic-hub/index.html         - hub landing page
#   /var/www/anthemic-hub/bass/index.html    - bass coaching static site
#   /var/www/setlist-generator/index.html    - Vite build output (base /setlist/)
#   setlist-api.service running on 127.0.0.1:8081
# =============================================================================

upstream setlist_api {
    server 127.0.0.1:8081;
}

# --- HTTP: ACME + redirect to HTTPS -----------------------------------------
server {
    listen 80;
    server_name anthemic-developments.com www.anthemic-developments.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;

    server_name anthemic-developments.com www.anthemic-developments.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/anthemic-developments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anthemic-developments.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # wasm-unsafe-eval + worker-src blob: required by model-viewer on /brain/.
    # style-src unsafe-inline kept: all pages use large inline <style> blocks (CSS vars, layout).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ajax.googleapis.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.bunny.net fonts.googleapis.com; font-src fonts.bunny.net fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # Larger upload size so song files / setlist imports go through nginx.
    client_max_body_size 80M;

    # ---- Set List API (proxy to Spring Boot on 127.0.0.1:8081) -------------
    location /api/ {
        proxy_pass http://setlist_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # ---- Set List SPA (Vite build, base /setlist/) -------------------------
    # Static files from disk; deep-link routes fall back to /setlist/index.html
    # so React Router (BrowserRouter basename=/setlist) can take over.
    # NOTE: no "=404" at the end — that short-circuits the SPA fallback when
    # combined with `alias`. Without it, the last try_files arg becomes an
    # internal redirect that re-enters this location and serves index.html.
    location = /setlist {
        return 301 https://$host/setlist/;
    }
    location /setlist/ {
        alias /var/www/setlist-generator/;
        try_files $uri $uri/ /setlist/index.html;
    }

    # ---- Hub + placeholders + bass static ---------------------------------
    root /var/www/anthemic-hub;
    index index.html;

    # ---- Gig admin (PHP container on 127.0.0.1:9001) -----------------------
    location = /gigs/admin { return 301 https://$host/gigs/admin/; }
    location /gigs/admin/ {
        auth_basic "Anthemic Admin";
        auth_basic_user_file /etc/nginx/conf.d/gigs-admin.htpasswd;
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bass: files live at /var/www/anthemic-hub/bass/ (hub CI + apply script).
    # try_files ends at /bass/index.html so GET /bass/ always resolves (root+index alone can 404 on some nginx builds).
    location = /personal { return 301 https://$host/personal/; }
    location = /bass     { return 301 https://$host/bass/; }
    location /personal/  { try_files $uri /index.html; }
    location /bass/ {
        root /var/www/anthemic-hub;
        try_files $uri $uri/index.html /bass/index.html;
    }

    # Hub landing + any unmatched path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
