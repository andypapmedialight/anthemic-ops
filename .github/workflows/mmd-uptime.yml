name: Morning Macro uptime

permissions:
  contents: read

on:
  schedule:
    # Every 15 minutes (GitHub Actions cron uses UTC).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Run slow valuation metric probe (BIS)"
        type: boolean
        default: false

concurrency:
  group: mmd-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fast probes
        env:
          BASE: https://anthemic-developments.com
        run: |
          set -euo pipefail
          probe() {
            local name="$1" url="$2" max="${3:-20}"
            code=$(curl -fsS -o "/tmp/mmd-${name}.out" -w "%{http_code}" --max-time "$max" "$url" || echo "000")
            echo "${name}: HTTP ${code}"
            [[ "${code}" == "200" ]] || { cat "/tmp/mmd-${name}.out" 2>/dev/null || true; exit 1; }
          }
          probe val-health "${BASE}/economics/proxy/valuation/health" 15
          probe fred-health "${BASE}/economics/proxy/fred/health" 15
          probe freshness "${BASE}/economics/api/freshness" 30
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("/tmp/mmd-freshness.out").read_text())
          assert d.get("fredApi"), d
          assert d.get("series"), d
          print("freshness: fredApi ok, series", len(d["series"]))
          PY
          probe economics-page "${BASE}/economics/" 20
          grep -qF 'macro.js' /tmp/mmd-economics-page.out

      - name: Deep probe (valuation live metric)
        if: github.event_name == 'workflow_dispatch' && inputs.deep
        env:
          BASE: https://anthemic-developments.com
        run: |
          set -euo pipefail
          code=$(curl -fsS -o /tmp/mmd-val-metric.json -w "%{http_code}" --max-time 120 \
            "${BASE}/economics/proxy/valuation?metric=margin-debt" || echo "000")
          echo "margin-debt: HTTP ${code}"
          [[ "${code}" == "200" ]] || exit 1
          python3 -c "import json; d=json.load(open('/tmp/mmd-val-metric.json')); assert d.get('display'), d"

      - name: Slack alert on failure
        if: failure()
        env:
          MMD_UPTIME_SLACK_WEBHOOK: ${{ secrets.MMD_UPTIME_SLACK_WEBHOOK }}
          PAPAWEB_SLACK_WEBHOOK: ${{ secrets.PAPAWEB_SLACK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = (
              os.environ.get("MMD_UPTIME_SLACK_WEBHOOK", "").strip()
              or os.environ.get("PAPAWEB_SLACK_WEBHOOK", "").strip()
          )
          if not webhook:
              print("No Slack webhook (set MMD_UPTIME_SLACK_WEBHOOK or PAPAWEB_SLACK_WEBHOOK)")
              raise SystemExit(0)

          run_url = os.environ.get("RUN_URL", "")
          text = "Morning Macro uptime check failed on anthemic-developments.com"
          blocks = [
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": f"*{text}*\nSee the GitHub Actions log for probe details.",
                  },
              },
          ]
          if run_url:
              blocks.append({
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": f"<{run_url}|View workflow run>"},
              })

          body = json.dumps({"text": text, "blocks": blocks}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("Slack alert sent:", resp.status)
          PY
