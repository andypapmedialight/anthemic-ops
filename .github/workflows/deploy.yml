name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "nginx/sites-available/anthemic-hub.conf"
      - "scripts/droplet/anthemic-nginx-apply.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-anthemic-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint nginx config (basic)
        run: |
          if grep -RInE 'TODO|FIXME' nginx/sites-available/ ; then
            echo "Refusing to deploy a config with TODO/FIXME markers."
            exit 1
          fi
          # Light syntactic sanity check (does not start nginx, just helps catch mistakes early)
          if ! grep -q 'server_name' nginx/sites-available/anthemic-hub.conf ; then
            echo "Missing server_name in anthemic-hub.conf"
            exit 1
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload candidate config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          RSYNC_SSH="ssh -p ${DEPLOY_PORT}"
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'mkdir -p /home/deploy/incoming-nginx/sites-available'
          rsync -avz -e "${RSYNC_SSH}" \
            nginx/sites-available/anthemic-hub.conf \
            "${DEPLOY_USER}@${DEPLOY_HOST}:incoming-nginx/sites-available/anthemic-hub.conf"
          rsync -avz -e "${RSYNC_SSH}" \
            scripts/droplet/anthemic-nginx-apply.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:incoming-nginx/anthemic-nginx-apply.sh"

      - name: Apply on Droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo /usr/local/bin/anthemic-nginx-apply.sh'

      - name: Smoke test (public HTTPS)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for url in \
            "https://anthemic-developments.com/" \
            "https://anthemic-developments.com/setlist/" \
          ; do
            c=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 2 "${url}")
            [[ "${c}" == "200" ]] || { echo "${url} returned HTTP ${c}"; exit 1; }
          done
          # Write /bass/ body to disk: large HTML into $(...) can still make curl exit 23 (write to pipe).
          code_bass=$(curl -sS --retry 3 --retry-delay 2 -o /tmp/anthemic-smoke-bass.html -w "%{http_code}" "https://anthemic-developments.com/bass/")
          [[ "${code_bass}" == "200" ]] || { echo "/bass/ returned HTTP ${code_bass}"; exit 1; }
          if grep -qF 'id="reading-list-root"' /tmp/anthemic-smoke-bass.html; then
            echo "/bass/ is serving the hub index (fix nginx try_files fallback to /bass/index.html)"
            exit 1
          fi
          if ! grep -qE 'Andy Pap — Bass|warmth-motif-canvas|thrives' /tmp/anthemic-smoke-bass.html; then
            echo "/bass/ response missing expected bass page markers (title, motif canvas, or hero headline)"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://anthemic-developments.com/api/v1/songs")
          if [[ "${code}" != "401" && "${code}" != "403" ]]; then
            echo "Unexpected API HTTP status: ${code} (expected 401 or 403)"
            exit 1
          fi
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'systemctl is-active --quiet mmd-valuation.service' \
            || { echo "mmd-valuation.service inactive — run anthemic-hub deploy first"; exit 1; }
          code_val=""
          for attempt in 1 2 3; do
            code_val=$(curl -sS -o /tmp/anthemic-smoke-val.json -w "%{http_code}" --max-time 120 \
              "https://anthemic-developments.com/economics/proxy/valuation?metric=otc-notional" || echo "000")
            [[ "${code_val}" == "200" ]] && break
            echo "valuation smoke attempt ${attempt}: HTTP ${code_val}" >&2
            sleep 10
          done
          [[ "${code_val}" == "200" ]] || {
            echo "/economics/proxy/valuation returned HTTP ${code_val}"
            ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'journalctl -u mmd-valuation.service -n 25 --no-pager' || true
            exit 1
          }
          python3 -c "import json; d=json.load(open('/tmp/anthemic-smoke-val.json')); assert d.get('display'), d"
